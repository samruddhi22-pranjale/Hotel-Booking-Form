<<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Booking Form</title>

<link rel="stylesheet" href="style.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

</head>

<body>

<header>
<div class="hotel-name">Royal stay</div>

<section class="booking">
<div class="form-box">
<h2>Book Your Room</h2>
<form id="bookingForm">

<div class="form-group">
<label>Full Name</label>
<input type="text" id="name">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email">
</div>

<div class="form-group">
<label>Check-in Date</label>
<input type="date" id="checkin"> 
</div>

<div class="form-group">
<label>Check-out Date</label>
<input type="date" id="checkout">
</div>

<div class="form-group">
<label>Room Type</label>
<select id="roomType" >

<option value="">Select Room</option>
<option value="single">Single</option>
<option value="double">Double</option>
<option value="suite">Suite</option>
</select>
</div>

<div class="form-group">
<label>Guest Count</label>
<input type="number" id="guests" min="1" max="5" required>
</div>

<div class="form-group">
<label>Special Requests</label>
<textarea rows="2"></textarea>
</div>

<p id="errorMessage" style="color:red;"></p>
<p id="successMessage" style="color:green;"></p>

<button type="submit">Book Now</button>
</form>
</div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function() {

const form = document.getElementById("bookingForm");
const nameInput = document.getElementById("name");
const checkin = document.getElementById("checkin");
const checkout = document.getElementById("checkout");
const roomType = document.getElementById("roomType");
const guests = document.getElementById("guests");
const errorMessage = document.getElementById("errorMessage");
const successMessage = document.getElementById("successMessage");

const today = new Date().toISOString().split("T")[0];
checkin.min = today;
checkout.min = today;

checkin.addEventListener("change", function() {
checkout.min = checkin.value;
});

form.addEventListener("submit", function(e) {

e.preventDefault();

errorMessage.textContent = "";
successMessage.textContent = "";

if(nameInput.value.trim() === ""){
errorMessage.textContent = "Please enter your name";
return;
}

/* Email validation */
if(email.value.trim() === ""){
errorMessage.textContent = "Please enter your email";
return;
}

if (!checkin.value || !checkout.value || !roomType.value || !guests.value) {
errorMessage.textContent = "Please fill all required fields";
return;
}

if (new Date(checkout.value) <= new Date(checkin.value)) {
errorMessage.textContent = "Check-out date must be after check-in date";
return;
}

if (parseInt(guests.value) > 5) {
errorMessage.textContent = "Maximum 5 guests allowed";
return;
}

successMessage.textContent = "Booking submitted successfully!";
form.reset();

});

});
</script>
